<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website Navigation</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Georgia, serif;
        }

        .box {
            border: 2px solid black;
            margin: 10px;
            padding: 0;
        }

        /* Header Bar */
        .header {
            background-color: #d9d9d9;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        .header span {
            color: red;
            font-weight: bold;
        }

        /* Navigation Buttons */
        .nav-container {
            margin: 20px;
        }

        .nav a {
            text-decoration: none;
            background-color: #b7d5ff;
            padding: 8px 12px;
            margin-right: 8px;
            display: inline-block;
            border: 1px solid #7fa9d6;
        }

        .nav2 a {
            text-decoration: none;
            background-color: #c1f7c1;
            padding: 8px 12px;
            margin-right: 8px;
            display: inline-block;
            border: 1px solid #7fc97f;
        }
    </style>
</head>

<body>

    <div class="box">

        <!-- Top Header -->
        <div class="header">
            My <span>Website</span> Navigation
        </div>

        <!-- First Row -->
        <div class="nav-container nav">
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Services</a>
            <a href="#">Contact</a>
        </div>

        <!-- Second Row -->
        <div class="nav-container nav2">
            <a href="#">Dashboard</a>
            <a href="#">Profile</a>
            <a href="#">Messages</a>
            <a href="#">Logout</a>
        </div>

    </div>

</body>
</html>
