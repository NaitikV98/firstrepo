<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Room Booking Form</title>
<style>
  body {
    font-family: Arial, sans-serif;
  }
  form {
    width: 400px;
    margin: 30px auto;
    padding: 20px;
    border: 2px solid black;
  }
  h2 {
    text-align: center;
    font-family: Georgia, 'Times New Roman', Times, serif;
  }
  label {
    display: inline-block;
    width: 150px;
    margin-bottom: 10px;
  }
  input, select, textarea {
    width: 200px;
    padding: 5px;
    margin-bottom: 10px;
  }
  textarea {
    width: 95%;
    height: 80px;
  }
  .buttons {
    text-align: center;
  }
  input[type="submit"], input[type="reset"] {
    padding: 6px 12px;
    margin: 5px;
  }
</style>
</head>
<body>

<form>
  <h2><b>Hotel Room Booking Form</b></h2>

  <label for="name">Full Name:</label>
  <input type="text" id="name" name="name"><br>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email"><br>

  <label for="phone">Phone:</label>
  <input type="tel" id="phone" name="phone"><br>

  <label for="checkin">Check-in Date:</label>
  <input type="date" id="checkin" name="checkin"><br>

  <label for="checkout">Check-out Date:</label>
  <input type="date" id="checkout" name="checkout"><br>

  <label for="room">Room Type:</label>
  <select id="room" name="room">
    <option>Single Room</option>
    <option>Double Room</option>
    <option>Suite</option>
  </select><br>

  <label for="guests">Number of Guests:</label>
  <input type="number" id="guests" name="guests" min="1"><br>

  <label for="requests">Special Requests:</label><br>
  <textarea id="requests" name="requests"></textarea><br>

  <div class="buttons">
    <input type="submit" value="Book Now">
    <input type="reset" value="Reset Form">
  </div>
</form>

</body>
</html>
