<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase</title>

    <style>
        body {
            margin: 0;
            font-family: Georgia, serif;
        }

        /* Outer Border */
        .outer-box {
            border: 2px solid black;
            margin: 15px;
            padding-bottom: 30px;
            min-height: 550px;
        }

        /* Navbar */
        .navbar {
            background-color: #1f1f1f;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .menu {
            display: flex;
            gap: 25px;
        }

        .menu a {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        /* Right Side (Cart + Login) */
        .right-options {
            display: flex;
            gap: 20px;
            font-size: 15px;
        }

        .right-options a {
            color: white;
            text-decoration: none;
        }

        /* Home Content */
        .content {
            margin: 25px;
        }

        .content h2 {
            margin-top: 10px;
        }
    </style>
</head>

<body>

    <div class="outer-box">

        <!-- NAVIGATION BAR -->
        <div class="navbar">
            <div class="logo">ShopEase</div>

            <div class="menu">
                <a href="#">Home</a>
                <a href="#">Products</a>
                <a href="#">Categories</a>
                <a href="#">Deals</a>
                <a href="#">Contact</a>
            </div>

            <div class="right-options">
                <a href="#">Cart 🛒</a>
                <a href="#">Login</a>
            </div>
        </div>

        <!-- MAIN CONTENT -->
        <div class="content">
            <h2>Welcome to ShopEase!</h2>
            <p>Your one-stop destination for all shopping needs.</p>
        </div>

    </div>

</body>
</html>
