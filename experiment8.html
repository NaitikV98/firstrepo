<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Cards</title>

    <style>
        body {
            font-family: Georgia, serif;
            margin: 0;
            padding: 0;
        }

        .outer-box {
            border: 2px solid black;
            margin: 20px;
            padding: 20px;
        }

        /* Cards container */
        .card-container {
            display: flex;
            justify-content: center;
            gap: 40px;
            flex-wrap: wrap;
        }

        /* Individual card */
        .card {
            width: 250px;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }

        /* Circle initials */
        .circle {
            width: 80px;
            height: 80px;
            background-color: #007bff;
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 15px auto;
            font-size: 22px;
            font-weight: bold;
        }

        .name {
            font-size: 19px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .details {
            font-size: 14px;
            color: #444;
            line-height: 20px;
        }
    </style>
</head>
<body>

    <div class="outer-box">

        <div class="card-container">

            <!-- Card 1 -->
            <div class="card">
                <div class="circle">JK</div>
                <div class="name">Jeet Kumar</div>
                <div class="details">
                    B.Tech - CSE <br>
                    Roll No: 21CS1007 <br>
                    1st Year
                </div>
            </div>

            <!-- Card 2 -->
            <div class="card">
                <div class="circle">AR</div>
                <div class="name">Asha Rani</div>
                <div class="details">
                    B.Tech - IT <br>
                    Roll No: 21IT1012 <br>
                    1st Year
                </div>
            </div>

            <!-- Card 3 -->
            <div class="card">
                <div class="circle">RK</div>
                <div class="name">Rohit Kumar</div>
                <div class="details">
                    B.Tech - ECE <br>
                    Roll No: 21EC1009 <br>
                    1st Year
                </div>
            </div>

        </div>

    </div>
Naitik Varshney

</body>
</html>
